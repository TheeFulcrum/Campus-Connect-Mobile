[versions]
agp = "9.4.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
core-splashscreen = "1.0.1"
shimmer = "0.5.0"
fragment = "1.8.6"
swiperefreshlayout = "1.1.0"
viewpager2 = "1.1.0"
recyclerview = "1.4.0"
glide = "4.16.0"
lifecycleViewmodel = "2.9.2"

[libraries]
